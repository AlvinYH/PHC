sim_device: "cuda:0"
pipeline: "gpu"
graphics_device_id: 0
subscenes: 0
slices: 0
use_flex: False

# Named Studio manipulation experiment. Match the selected 3000-epoch
# experiment's PhysX worker count and contact envelope.
substeps: 2
physx:
  step_dt: 1/60
  num_threads: 8
  solver_type: 1
  num_position_iterations: 4
  num_velocity_iterations: 0
  contact_offset: 0.02
  rest_offset: 0.0
  bounce_threshold_velocity: 0.2
  max_depenetration_velocity: 10.0
  default_buffer_size_multiplier: 10.0

flex:
  num_inner_iterations: 10
  warm_start: 0.25
