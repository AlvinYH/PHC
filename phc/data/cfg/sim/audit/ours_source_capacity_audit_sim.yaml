sim_device: "cuda:0"
pipeline: "gpu"
graphics_device_id: 0
subscenes: 0
slices: 0
use_flex: false

# Audit-only source runtime capacity values.  These do not change contact
# geometry or solver iterations; they close the last two SimParams deltas in
# the paired one-environment rollout.
substeps: 2
physx:
  step_dt: 1/60
  num_threads: 8
  solver_type: 1
  num_position_iterations: 4
  num_velocity_iterations: 0
  contact_offset: 0.002
  rest_offset: 0.0
  bounce_threshold_velocity: 0.2
  max_depenetration_velocity: 10.0
  default_buffer_size_multiplier: 2.0
  max_gpu_contact_pairs: 8388608

flex:
  num_inner_iterations: 10
  warm_start: 0.25
