params:
  seed: 0

  algo:
    name: im_task

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: const_initializer
          val: 0.0
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False

  config:
    name: Humanoid
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 100000
    save_best_after: 250
    save_frequency: 250
    print_stats: True
    save_intermediate: False
    entropy_coef: 0.0
    truncate_grads: False
    grad_norm: 1.0
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    bounds_loss_coef: 10

    # Task-only PPO: no AMP buffers, discriminator, or zero-weight AMP passes.
    normalize_amp_input: False
    disc_reward_scale: 0

    player:
      games_num: 50000000
